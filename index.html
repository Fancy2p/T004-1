<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 - SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #eef6f7;
			font-family: Arial, sans-serif;
		}

		svg {
			width: min(94vw, 800px);
			height: auto;
			border: 4px solid #315b63;
			border-radius: 8px;
			box-shadow: 0 8px 20px rgba(49, 91, 99, 0.2);
			background: #bfe8f5;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated #annotations text,
		#scene-annotated #annotations line {
			pointer-events: none;
		}

		#scene-adjusted .adjusted-fence {
			stroke: #fff8e8;
			stroke-width: 6;
			stroke-dasharray: 12 8;
		}

		#scene-adjusted .adjusted-path {
			fill: #c3a06b;
			stroke: #684b32;
			stroke-width: 5;
		}
	</style>
</head>
<body>
	<figure id="scene-original">
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
		<title id="scene-title">A house and garden beneath a sunny sky</title>
		<desc id="scene-desc">A colorful countryside scene with a blue sky, sun, cloud, tree, house, garden fence, and curved path.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f5"></rect>
		<rect x="0" y="330" width="800" height="170" fill="#8bcf76"></rect>

		<!-- Sun -->
		<circle cx="685" cy="92" r="48" fill="#ffd45c" stroke="#e5a936" stroke-width="5"></circle>
		<line x1="685" y1="22" x2="685" y2="5" stroke="#e5a936" stroke-width="5"></line>
		<line x1="685" y1="162" x2="685" y2="179" stroke="#e5a936" stroke-width="5"></line>
		<line x1="615" y1="92" x2="598" y2="92" stroke="#e5a936" stroke-width="5"></line>
		<line x1="755" y1="92" x2="772" y2="92" stroke="#e5a936" stroke-width="5"></line>

		<!-- Cloud -->
		<ellipse cx="168" cy="92" rx="64" ry="27" fill="#ffffff"></ellipse>
		<circle cx="132" cy="84" r="26" fill="#ffffff"></circle>
		<circle cx="171" cy="68" r="36" fill="#ffffff"></circle>
		<circle cx="211" cy="85" r="27" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="104" y="211" width="30" height="124" rx="4" fill="#89542e"></rect>
		<circle cx="119" cy="164" r="58" fill="#4f9c52"></circle>
		<circle cx="77" cy="190" r="42" fill="#60aa58"></circle>
		<circle cx="163" cy="190" r="43" fill="#438d4c"></circle>

		<!-- House body, roof, and chimney -->
		<rect x="270" y="214" width="286" height="170" fill="#f4c27a" stroke="#75472f" stroke-width="6"></rect>
		<polygon points="245,218 410,88 581,218" fill="#b85845" stroke="#75472f" stroke-width="7"></polygon>
		<rect x="473" y="126" width="38" height="78" fill="#75472f" stroke="#5d3828" stroke-width="5"></rect>

		<!-- Door and windows -->
		<rect x="375" y="286" width="67" height="98" fill="#6d4730" stroke="#4d3224" stroke-width="5"></rect>
		<circle cx="426" cy="337" r="5" fill="#f7d27c"></circle>
		<rect x="297" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="326" y1="252" x2="326" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="297" y1="279" x2="355" y2="279" stroke="#4d6970" stroke-width="4"></line>
		<rect x="468" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="497" y1="252" x2="497" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="468" y1="279" x2="526" y2="279" stroke="#4d6970" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="35,344 35,300 60,300 60,344 85,344 85,300 110,300 110,344 135,344 135,300 160,300 160,344 185,344 185,300 210,300 210,344" fill="none" stroke="#f4eee0" stroke-width="8" stroke-linejoin="round"></polyline>
		<line x1="25" y1="320" x2="220" y2="320" stroke="#f4eee0" stroke-width="7"></line>

		<!-- Curved garden path -->
		<path d="M 409 384 C 404 410, 350 432, 326 500 L 511 500 C 483 438, 442 411, 442 384 Z" fill="#d8b27c" stroke="#a77b4c" stroke-width="4"></path>

		<!-- Garden flowers -->
		<circle cx="248" cy="411" r="8" fill="#e95c68"></circle>
		<circle cx="248" cy="411" r="3" fill="#ffd45c"></circle>
		<circle cx="560" cy="420" r="8" fill="#e95c68"></circle>
		<circle cx="560" cy="420" r="3" fill="#ffd45c"></circle>

		<text x="400" y="466" text-anchor="middle" font-size="24" font-weight="bold" fill="#315b63">Welcome to our garden</text>
	</svg>
		<figcaption>Original scene</figcaption>
	</figure>

	<figure id="scene-annotated-figure">
	<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="annotated-title annotated-desc">
		<title id="annotated-title">Annotated house and garden scene</title>
		<desc id="annotated-desc">The original house and garden scene with labels identifying SVG shape attributes.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f5"></rect>
		<rect x="0" y="330" width="800" height="170" fill="#8bcf76"></rect>

		<!-- Sun -->
		<circle cx="685" cy="92" r="48" fill="#ffd45c" stroke="#e5a936" stroke-width="5"></circle>
		<line x1="685" y1="22" x2="685" y2="5" stroke="#e5a936" stroke-width="5"></line>
		<line x1="685" y1="162" x2="685" y2="179" stroke="#e5a936" stroke-width="5"></line>
		<line x1="615" y1="92" x2="598" y2="92" stroke="#e5a936" stroke-width="5"></line>
		<line x1="755" y1="92" x2="772" y2="92" stroke="#e5a936" stroke-width="5"></line>

		<!-- Cloud -->
		<ellipse cx="168" cy="92" rx="64" ry="27" fill="#ffffff"></ellipse>
		<circle cx="132" cy="84" r="26" fill="#ffffff"></circle>
		<circle cx="171" cy="68" r="36" fill="#ffffff"></circle>
		<circle cx="211" cy="85" r="27" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="104" y="211" width="30" height="124" rx="4" fill="#89542e"></rect>
		<circle cx="119" cy="164" r="58" fill="#4f9c52"></circle>
		<circle cx="77" cy="190" r="42" fill="#60aa58"></circle>
		<circle cx="163" cy="190" r="43" fill="#438d4c"></circle>

		<!-- House body, roof, and chimney -->
		<rect x="270" y="214" width="286" height="170" fill="#f4c27a" stroke="#75472f" stroke-width="6"></rect>
		<polygon points="245,218 410,88 581,218" fill="#b85845" stroke="#75472f" stroke-width="7"></polygon>
		<rect x="473" y="126" width="38" height="78" fill="#75472f" stroke="#5d3828" stroke-width="5"></rect>

		<!-- Door and windows -->
		<rect x="375" y="286" width="67" height="98" fill="#6d4730" stroke="#4d3224" stroke-width="5"></rect>
		<circle cx="426" cy="337" r="5" fill="#f7d27c"></circle>
		<rect x="297" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="326" y1="252" x2="326" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="297" y1="279" x2="355" y2="279" stroke="#4d6970" stroke-width="4"></line>
		<rect x="468" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="497" y1="252" x2="497" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="468" y1="279" x2="526" y2="279" stroke="#4d6970" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="35,344 35,300 60,300 60,344 85,344 85,300 110,300 110,344 135,344 135,300 160,300 160,344 185,344 185,300 210,300 210,344" fill="none" stroke="#f4eee0" stroke-width="8" stroke-linejoin="round"></polyline>
		<line x1="25" y1="320" x2="220" y2="320" stroke="#f4eee0" stroke-width="7"></line>

		<!-- Curved garden path -->
		<path d="M 409 384 C 404 410, 350 432, 326 500 L 511 500 C 483 438, 442 411, 442 384 Z" fill="#d8b27c" stroke="#a77b4c" stroke-width="4"></path>

		<!-- Garden flowers -->
		<circle cx="248" cy="411" r="8" fill="#e95c68"></circle>
		<circle cx="248" cy="411" r="3" fill="#ffd45c"></circle>
		<circle cx="560" cy="420" r="8" fill="#e95c68"></circle>
		<circle cx="560" cy="420" r="3" fill="#ffd45c"></circle>

		<text x="400" y="466" text-anchor="middle" font-size="24" font-weight="bold" fill="#315b63">Welcome to our garden</text>

		<g id="annotations">
			<line x1="685" y1="92" x2="615" y2="48"></line>
			<text x="520" y="42">circle (cx=685, cy=92, r=48)</text>

			<line x1="270" y1="214" x2="205" y2="230"></line>
			<text x="35" y="235">rect (x=270, y=214, width=286, height=170)</text>

			<line x1="168" y1="92" x2="92" y2="115"></line>
			<text x="10" y="130">ellipse (cx=168, cy=92, rx=64, ry=27)</text>

			<line x1="685" y1="22" x2="735" y2="18"></line>
			<text x="738" y="22">line (685,22) -&gt; (685,5)</text>

			<line x1="110" y1="344" x2="90" y2="375"></line>
			<text x="15" y="392">polyline (35,344 35,300 ...)</text>

			<line x1="410" y1="88" x2="470" y2="72"></line>
			<text x="475" y="75">polygon (245,218 410,88 ...)</text>

			<line x1="409" y1="384" x2="540" y2="365"></line>
			<text x="545" y="368">path (M 409 384 C 404 410 ... L 511 500)</text>

			<line x1="400" y1="466" x2="535" y2="475"></line>
			<text x="540" y="479">text (x=400, y=466)</text>
		</g>
	</svg>
		<figcaption>Annotated scene (Step 2)</figcaption>
	</figure>

	<figure id="scene-adjusted-figure">
	<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-title adjusted-desc">
		<title id="adjusted-title">Adjusted house and garden scene</title>
		<desc id="adjusted-desc">An adjusted house and garden scene with improved contrast, a dashed fence, a stone footpath, mailbox, and chimney smoke.</desc>

		<!-- Sky and grass retain the original coordinate scale. -->
		<rect x="0" y="0" width="800" height="500" fill="#b8e2f0"></rect>
		<rect x="0" y="330" width="800" height="170" fill="#72b95e"></rect>

		<!-- Sun -->
		<circle cx="685" cy="92" r="48" fill="#ffd45c" stroke="#b77b16" stroke-width="6"></circle>
		<line x1="685" y1="22" x2="685" y2="5" stroke="#b77b16" stroke-width="4"></line>
		<line x1="685" y1="162" x2="685" y2="179" stroke="#b77b16" stroke-width="4"></line>
		<line x1="615" y1="92" x2="598" y2="92" stroke="#b77b16" stroke-width="4"></line>
		<line x1="755" y1="92" x2="772" y2="92" stroke="#b77b16" stroke-width="4"></line>

		<!-- Cloud -->
		<ellipse cx="168" cy="92" rx="64" ry="27" fill="#ffffff" stroke="#d8e9ed" stroke-width="2"></ellipse>
		<circle cx="132" cy="84" r="26" fill="#ffffff"></circle>
		<circle cx="171" cy="68" r="36" fill="#ffffff"></circle>
		<circle cx="211" cy="85" r="27" fill="#ffffff"></circle>

		<!-- Balance adjustment: move the tree slightly left and down. -->
		<g transform="translate(-10 5)">
			<rect x="104" y="211" width="30" height="124" rx="4" fill="#70401f" stroke="#4b2b1b" stroke-width="3"></rect>
			<circle cx="119" cy="164" r="58" fill="#398542" stroke="#246330" stroke-width="3"></circle>
			<circle cx="77" cy="190" r="42" fill="#4d9849"></circle>
			<circle cx="163" cy="190" r="43" fill="#31783b"></circle>
		</g>

		<!-- Balance adjustment: move the house slightly right. -->
		<g transform="translate(18 0)">
			<rect x="270" y="214" width="286" height="170" fill="#efb762" stroke="#5b3425" stroke-width="7"></rect>
			<polygon points="245,218 410,88 581,218" fill="#963f35" stroke="#5b3425" stroke-width="8"></polygon>
			<rect x="473" y="126" width="38" height="78" fill="#5b3425" stroke="#3f251b" stroke-width="6"></rect>

			<!-- Door and windows use stronger outlines for contrast. -->
			<rect x="375" y="286" width="67" height="98" fill="#553322" stroke="#321f16" stroke-width="6"></rect>
			<circle cx="426" cy="337" r="5" fill="#ffe08a"></circle>
			<rect x="297" y="252" width="58" height="54" fill="#a7e5ef" stroke="#294f59" stroke-width="6"></rect>
			<line x1="326" y1="252" x2="326" y2="306" stroke="#294f59" stroke-width="3"></line>
			<line x1="297" y1="279" x2="355" y2="279" stroke="#294f59" stroke-width="3"></line>
			<rect x="468" y="252" width="58" height="54" fill="#a7e5ef" stroke="#294f59" stroke-width="6"></rect>
			<line x1="497" y1="252" x2="497" y2="306" stroke="#294f59" stroke-width="3"></line>
			<line x1="468" y1="279" x2="526" y2="279" stroke="#294f59" stroke-width="3"></line>
		</g>

		<!-- Customisation: replace the solid fence look with a dashed stroke. -->
		<polyline class="adjusted-fence" points="35,344 35,300 60,300 60,344 85,344 85,300 110,300 110,344 135,344 135,300 160,300 160,344 185,344 185,300 210,300 210,344" fill="none" stroke-linejoin="round"></polyline>
		<line class="adjusted-fence" x1="25" y1="320" x2="220" y2="320"></line>

		<!-- Original garden path plus a new curved stone footpath to the adjusted door. -->
		<path d="M 409 384 C 404 410, 350 432, 326 500 L 511 500 C 483 438, 442 411, 442 384 Z" fill="#c3a06b" stroke="#684b32" stroke-width="4"></path>
		<path class="adjusted-path" d="M 426 384 C 426 407, 465 426, 480 500 L 590 500 C 553 431, 478 408, 443 384 Z"></path>

		<!-- Customisation: a small mailbox beside the new path. -->
		<rect x="535" y="355" width="30" height="30" fill="#3d7190" stroke="#263e4b" stroke-width="3"></rect>
		<path d="M 535 355 A 15 15 0 0 1 565 355 Z" fill="#5b9fbd" stroke="#263e4b" stroke-width="3"></path>
		<polygon points="532,385 568,385 560,392 540,392" fill="#6b452c" stroke="#422b1d" stroke-width="2"></polygon>

		<!-- Customisation: subtle chimney smoke made from overlapping ellipses. -->
		<ellipse cx="500" cy="108" rx="15" ry="9" fill="#d9e1e2" opacity="0.8"></ellipse>
		<ellipse cx="512" cy="87" rx="19" ry="11" fill="#d9e1e2" opacity="0.65"></ellipse>
		<ellipse cx="500" cy="63" rx="12" ry="8" fill="#d9e1e2" opacity="0.5"></ellipse>

		<!-- Garden flowers and caption -->
		<circle cx="248" cy="411" r="8" fill="#d93650"></circle>
		<circle cx="248" cy="411" r="3" fill="#ffe066"></circle>
		<circle cx="560" cy="420" r="8" fill="#d93650"></circle>
		<circle cx="560" cy="420" r="3" fill="#ffe066"></circle>
		<text x="400" y="466" text-anchor="middle" font-size="24" font-weight="bold" fill="#244952">Welcome to our garden</text>
	</svg>
		<figcaption>Adjusted scene (Step 3)</figcaption>
	</figure>
</body>
</html>
