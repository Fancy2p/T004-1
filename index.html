<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 - SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #eef6f7;
			font-family: Arial, sans-serif;
		}

		svg {
			width: min(94vw, 800px);
			height: auto;
			border: 4px solid #315b63;
			border-radius: 8px;
			box-shadow: 0 8px 20px rgba(49, 91, 99, 0.2);
			background: #bfe8f5;
		}
	</style>
</head>
<body>
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
		<title id="scene-title">A house and garden beneath a sunny sky</title>
		<desc id="scene-desc">A colorful countryside scene with a blue sky, sun, cloud, tree, house, garden fence, and curved path.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="500" fill="#bfe8f5"></rect>
		<rect x="0" y="330" width="800" height="170" fill="#8bcf76"></rect>

		<!-- Sun -->
		<circle cx="685" cy="92" r="48" fill="#ffd45c" stroke="#e5a936" stroke-width="5"></circle>
		<line x1="685" y1="22" x2="685" y2="5" stroke="#e5a936" stroke-width="5"></line>
		<line x1="685" y1="162" x2="685" y2="179" stroke="#e5a936" stroke-width="5"></line>
		<line x1="615" y1="92" x2="598" y2="92" stroke="#e5a936" stroke-width="5"></line>
		<line x1="755" y1="92" x2="772" y2="92" stroke="#e5a936" stroke-width="5"></line>

		<!-- Cloud -->
		<ellipse cx="168" cy="92" rx="64" ry="27" fill="#ffffff"></ellipse>
		<circle cx="132" cy="84" r="26" fill="#ffffff"></circle>
		<circle cx="171" cy="68" r="36" fill="#ffffff"></circle>
		<circle cx="211" cy="85" r="27" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="104" y="211" width="30" height="124" rx="4" fill="#89542e"></rect>
		<circle cx="119" cy="164" r="58" fill="#4f9c52"></circle>
		<circle cx="77" cy="190" r="42" fill="#60aa58"></circle>
		<circle cx="163" cy="190" r="43" fill="#438d4c"></circle>

		<!-- House body, roof, and chimney -->
		<rect x="270" y="214" width="286" height="170" fill="#f4c27a" stroke="#75472f" stroke-width="6"></rect>
		<polygon points="245,218 410,88 581,218" fill="#b85845" stroke="#75472f" stroke-width="7"></polygon>
		<rect x="473" y="126" width="38" height="78" fill="#75472f" stroke="#5d3828" stroke-width="5"></rect>

		<!-- Door and windows -->
		<rect x="375" y="286" width="67" height="98" fill="#6d4730" stroke="#4d3224" stroke-width="5"></rect>
		<circle cx="426" cy="337" r="5" fill="#f7d27c"></circle>
		<rect x="297" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="326" y1="252" x2="326" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="297" y1="279" x2="355" y2="279" stroke="#4d6970" stroke-width="4"></line>
		<rect x="468" y="252" width="58" height="54" fill="#9dd9e6" stroke="#4d6970" stroke-width="5"></rect>
		<line x1="497" y1="252" x2="497" y2="306" stroke="#4d6970" stroke-width="4"></line>
		<line x1="468" y1="279" x2="526" y2="279" stroke="#4d6970" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="35,344 35,300 60,300 60,344 85,344 85,300 110,300 110,344 135,344 135,300 160,300 160,344 185,344 185,300 210,300 210,344" fill="none" stroke="#f4eee0" stroke-width="8" stroke-linejoin="round"></polyline>
		<line x1="25" y1="320" x2="220" y2="320" stroke="#f4eee0" stroke-width="7"></line>

		<!-- Curved garden path -->
		<path d="M 409 384 C 404 410, 350 432, 326 500 L 511 500 C 483 438, 442 411, 442 384 Z" fill="#d8b27c" stroke="#a77b4c" stroke-width="4"></path>

		<!-- Garden flowers -->
		<circle cx="248" cy="411" r="8" fill="#e95c68"></circle>
		<circle cx="248" cy="411" r="3" fill="#ffd45c"></circle>
		<circle cx="560" cy="420" r="8" fill="#e95c68"></circle>
		<circle cx="560" cy="420" r="3" fill="#ffd45c"></circle>

		<text x="400" y="466" text-anchor="middle" font-size="24" font-weight="bold" fill="#315b63">Welcome to our garden</text>
	</svg>
</body>
</html>
